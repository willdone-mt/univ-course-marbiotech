name: Build and Deploy Website and PDF

on:
  push:
    branches: [main]

env:
  BASE_URL: /${{ github.event.repository.name }}

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: typst-community/setup-typst@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Inject per-page export frontmatter
        run: python scripts/inject_page_exports.py

      - name: Build PDF
        run: jupyter book build --execute --pdf

      - name: Build HTML
        run: jupyter book build --execute --html

      - name: Upload Output HTML as Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_build/html'

  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4